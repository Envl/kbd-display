name: CI
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: swift test
      - run: swift test -c release
      - run: scripts/build.sh release
        env:
          KBD_DISPLAY_SIGN_IDENTITY: '-'
      - run: npm run check --prefix web
