name: Publish macOS update
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: macos-stable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: swift test -c release
      - name: Build, notarize and sign the update feed
        run: scripts/ci-release.sh
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      - name: Publish the archive and appcast together
        run: scripts/publish-release.sh
        env:
          GH_TOKEN: ${{ github.token }}
